<div class="page-hero">
  <h1>{{ pageTitle }}</h1>
  <p *ngIf="!searchQuery">Fashion and lifestyle pieces, entirely imaginary, wonderfully curated.</p>
  <p *ngIf="searchQuery">{{ filtered.length }} results found</p>
</div>

<div class="shop-layout container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="filter-section">
      <h3>Categories</h3>
      <div class="filter-list">
        <button *ngFor="let cat of categories"
          [class.active]="selectedCategory === cat"
          (click)="setCategory(cat)">
          {{ cat }}
        </button>
      </div>
    </div>

    <div class="filter-section" *ngIf="selectedCategory && subcategories[selectedCategory]">
      <h3>{{ selectedCategory }}</h3>
      <div class="filter-list">
        <button *ngFor="let sub of subcategories[selectedCategory]"
          [class.active]="selectedSubcategory === sub"
          (click)="setSubcategory(sub)">
          {{ sub }}
        </button>
      </div>
    </div>
  </aside>

  <!-- Main grid -->
  <main class="products-main">
    <div class="toolbar">
      <span class="result-count">{{ filtered.length }} pieces</span>
      <div class="sort-wrap">
        <label>Sort by</label>
        <select [(ngModel)]="sortBy" (change)="onSort()">
          <option value="default">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Most Loved</option>
        </select>
      </div>
    </div>

    <div class="products-grid" *ngIf="!loading && filtered.length > 0">
      <app-product-card
        *ngFor="let p of filtered"
        [product]="p"
        (addedToCart)="onAddedToCart($event)">
      </app-product-card>
    </div>

    <div *ngIf="loading" class="loading-container">
      <div class="spinner"></div>
    </div>

    <div *ngIf="!loading && filtered.length === 0" class="empty-state">
      <div class="empty-icon">🛍️</div>
      <h3>Nothing here yet</h3>
      <p>Try a different category or search term.</p>
      <button class="btn-primary" (click)="selectedCategory=''; selectedSubcategory=''; loadProducts()">View All</button>
    </div>
  </main>
</div>

<div *ngIf="toast" class="toast success">{{ toast }} ✓</div>
