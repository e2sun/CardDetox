<div class="wheel-container">
  <div class="wheel-pointer">▼</div>
  <div class="wheel-wrap">
    <svg class="wheel" viewBox="0 0 300 300" [style.transform]="'rotate(' + rotation + 'deg)'"
      [class.spinning]="spinning">
      <g *ngFor="let seg of segments; let i = index">
        <path
          [attr.d]="getSlicePath(i)"
          [attr.fill]="seg.color"
          stroke="#FAF7F2" stroke-width="2"/>
        <text
          [attr.transform]="getTextTransform(i)"
          text-anchor="middle"
          fill="white"
          font-size="11"
          font-weight="600"
          font-family="Inter, sans-serif">
          {{ seg.label }}
        </text>
      </g>
      <circle cx="150" cy="150" r="20" fill="#FAF7F2" stroke="#2A2118" stroke-width="2"/>
      <text x="150" y="155" text-anchor="middle" fill="#2A2118" font-size="9" font-weight="700" font-family="Inter, sans-serif">DT</text>
    </svg>
  </div>

  <button class="spin-btn" (click)="spin()" [disabled]="!canSpin || spinning">
    <span *ngIf="!spinning && canSpin">Spin!</span>
    <span *ngIf="spinning">Spinning...</span>
    <span *ngIf="!spinning && !canSpin">Come Back Tomorrow</span>
  </button>
</div>
