spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cartdetox;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:cartdetox-super-secret-key-2024-fashion-lifestyle-app}
  expiration: 86400000

server:
  port: ${PORT:8080}

logging:
  level:
    com.cartdetox: INFO
